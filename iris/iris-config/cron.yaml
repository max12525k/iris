# Iris-managed scheduled jobs.
#
# Jobs listed here are reconciled into Hermes's cron system at every boot,
# so they survive force-recreate AND fresh-clone. Names are prefixed with
# "iris." in Hermes — manual jobs created via `hermes cron create` (without
# the iris. prefix) are not touched by reconcile.
#
# Add via:    iris-cron add "<schedule>" "<prompt>" --name <name> [opts]
# Remove via: iris-cron rm <name>
# Inspect:    iris-cron list   (or `hermes cron list` for raw view)
#
# Schema for each job (fields in priority order):
#   name:     short slug — gets prefixed to "iris.<name>" in Hermes
#   schedule: cron expression ("0 9 * * 1") or interval ("every 24h", "30m")
#   prompt:   the task instruction injected when the job fires
#   deliver:  optional delivery channel: origin, local, telegram, discord,
#             signal, or "platform:chat_id"
#   skills:   optional list of skill names attached to this job
#   workdir:  optional absolute path to use as cwd (loads AGENTS.md/CLAUDE.md)

jobs:
  # V2 Plane 3 — Hermes Curator review pass. Hermes ships a curator that
  # archives stale (30d unused) and old (90d unused) user-authored skills,
  # consolidates overlapping ones, and patches underperforming ones. Without
  # a schedule it never fires. We invoke it via a thin LLM prompt so the
  # run + outcome land in the event log alongside everything else.
  - name: nightly-curator
    schedule: 0 3 * * *
    prompt: |
      Run 'hermes curator run' via your terminal tool to perform the
      nightly skill review pass. After it completes, summarize in 2-3
      bullets: which skills were archived, consolidated, or patched.
      If no actions were taken, say "no changes". Report only that
      summary.
    deliver: local

  # V2 Plane 1 — daily lessons render. The boot-time render only fires on
  # container start; running this nightly catches lessons recorded during
  # long-running gateway sessions and keeps the iris-lessons skill fresh.
  - name: nightly-lessons-render
    schedule: 0 4 * * *
    prompt: |
      Run 'iris-lessons-render' via your terminal tool to refresh the
      iris-lessons skill from /opt/data/iris-lessons.jsonl. Report the
      count of lessons rendered (one line).
    deliver: local

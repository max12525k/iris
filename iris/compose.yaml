volumes:
  data:

services:
  iris-gateway:
    build:
      context: .
      dockerfile: Dockerfile.iris-bridge
    image: iris-bridge:local
    container_name: iris-gateway
    restart: unless-stopped
    volumes:
      - data:/opt/data
      - ${HOME}/iris-workspace:/workspace
      # Mounted RW (not :ro) because the claude-wrapper does `docker exec`
      # to delegate work to the claude-cli sidecar — that's a write-side API
      # call. Hermes is added to the root group at entrypoint so the
      # `srw-rw---- root:root` socket inside the container is reachable.
      - /var/run/docker.sock:/var/run/docker.sock
      # Self-modification (L3): Iris reads + writes the repo source. Pre-commit
      # guard (scripts/iris-pre-commit-guard.sh) blocks secrets / personal data /
      # iris-authored commits on main or touching protected paths. Iris commits
      # to iris-proposed/* branches; user reviews + pushes via PR.
      - ${IRIS_REPO:-${HOME}/personal_assistant/iris}:/repo:rw
    environment:
      HERMES_UID: ${HERMES_UID:-10000}
      HERMES_GID: ${HERMES_GID:-10000}
      PRESIDIO_ANALYZER_API_BASE: http://presidio-analyzer:3000
      PRESIDIO_ANONYMIZER_API_BASE: http://presidio-anonymizer:3000
      # Messaging adapters — Hermes auto-starts the bot if BOT_TOKEN is set.
      # ALLOWED_USERS gates who can talk to it. Defaults to empty so bots
      # don't start unless you've configured them in .env.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ALLOWED_USERS: ${TELEGRAM_ALLOWED_USERS:-}
      TELEGRAM_HOME_CHANNEL: ${TELEGRAM_HOME_CHANNEL:-}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_ALLOWED_USERS: ${DISCORD_ALLOWED_USERS:-}
      DISCORD_HOME_CHANNEL: ${DISCORD_HOME_CHANNEL:-}
      # Iris bot git identity (used when Iris commits to iris-proposed/* branches)
      IRIS_BOT_NAME: ${IRIS_BOT_NAME:-iris-bot}
      IRIS_BOT_EMAIL: ${IRIS_BOT_EMAIL:-iris-bot@local}
      # V2 Plane 1 — every iris-* wrapper invocation emits an OTel span here.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-iris-default}
      HERMES_PROFILE: ${HERMES_PROFILE:-default}
      IRIS_TENANT: ${IRIS_TENANT:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - frontend  # for Presidio access from Layer-1 hook
      - backend
    command: ["gateway", "run"]

  iris-dashboard:
    # Same bridge image as iris-gateway — adds chown of /opt/hermes/ui-tui so
    # the dashboard's runtime `npm install` for the --tui Chat tab succeeds.
    image: iris-bridge:local
    container_name: iris-dashboard
    restart: unless-stopped
    depends_on:
      - iris-gateway
    volumes:
      - data:/opt/data
      - ${HOME}/iris-workspace:/workspace
    environment:
      HERMES_UID: ${HERMES_UID:-10000}
      HERMES_GID: ${HERMES_GID:-10000}
    networks:
      - frontend
      - backend
    ports:
      - "127.0.0.1:9119:9119"
    # --insecure is required because we bind to 0.0.0.0 inside the container.
    # Safe here: compose publishes port 9119 only to host 127.0.0.1, not 0.0.0.0.
    # --tui exposes the in-browser Chat tab (embedded `hermes --tui` over PTY/WebSocket).
    # Without it, the dashboard is sessions/config/skills only — no chat surface.
    command: ["dashboard", "--host", "0.0.0.0", "--no-open", "--insecure", "--tui"]

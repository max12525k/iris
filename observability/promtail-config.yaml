# Promtail — tails docker container stdout/stderr into Loki.
#
# Discovery: every container's logs at /var/lib/docker/containers/*/*.log
# Label set: container name, compose service, image, profile (env var).
# Sent to: http://loki:3100/loki/api/v1/push

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        target_label: 'project'
    pipeline_stages:
      # Try to parse JSON-shaped log lines (Hermes outputs structured JSON);
      # fall through if it's not JSON.
      - json:
          expressions:
            level:
            timestamp:
            msg:
            trace_id:
            profile:
      # Promote parsed fields to Loki labels (low cardinality only).
      - labels:
          level:
      # Attach trace_id as a structured field for cross-service correlation.
      - structured_metadata:
          trace_id:
          profile:

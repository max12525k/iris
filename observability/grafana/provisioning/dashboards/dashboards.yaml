# Auto-load dashboards from /var/lib/grafana/dashboards at startup.
# JSON files dropped in there appear in Grafana without manual import.

apiVersion: 1

providers:
  - name: 'iris-fleet'
    orgId: 1
    folder: 'Iris V2'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false

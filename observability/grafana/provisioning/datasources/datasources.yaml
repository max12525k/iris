# Auto-provisioned Grafana datasources (loaded at startup; immutable in UI).
#
# Two sources:
#   prometheus — scrapes existing iris stack (LiteLLM, Hermes /metrics)
#                AND our new otel-collector at :8889
#   loki       — receives logs from promtail + structured events from
#                otel-collector

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s
      httpMethod: POST

  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      timeout: 60
      maxLines: 5000
      derivedFields:
        # Click on a trace_id in any log line → jumps to all logs with that ID.
        - datasourceUid: loki_uid
          matcherRegex: 'trace_id["=:]+([a-f0-9]+)'
          name: trace_id
          url: '$${__value.raw}'

  # V2 Phase 6 — append-only audit log Postgres. Read-only role (audit_reader)
  # so a compromised Grafana session cannot mutate compliance records.
  # Password is interpolated from the AUDIT_READER_PASSWORD env var on the
  # grafana container.
  - name: AuditDB
    type: postgres
    access: proxy
    url: audit-db:5432
    user: audit_reader
    secureJsonData:
      password: ${AUDIT_READER_PASSWORD}
    jsonData:
      database: audit
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
      maxOpenConns: 10
      maxIdleConns: 2
      connMaxLifetime: 14400
    editable: false

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'litellm'
    static_configs:
      - targets: ['litellm:4000']
    metrics_path: '/metrics'

  # V2 Plane 1 — span/metric counters from iris-* wrappers, fanned out
  # by the OTel collector as Prometheus metrics on :8889.
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']
    metrics_path: '/metrics'

  # V2 Plane 1 — OTel collector self-telemetry (queue depth, drops, errors).
  - job_name: 'otel-collector-self'
    static_configs:
      - targets: ['otel-collector:8888']
    metrics_path: '/metrics'

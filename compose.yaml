name: iris

include:
  - ./iris/compose.yaml
  - ./litellm/compose.yaml
  - ./honcho/compose.yaml
  - ./claude-cli/compose.yaml
  - ./observability/compose.yaml      # V2 Plane 1: OTel + Loki + Promtail + Grafana
